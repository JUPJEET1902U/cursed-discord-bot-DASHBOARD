name: Server Protection Dashboard CI

on:
  pull_request:
    paths:
      - "cursed-dashboard-/cursed-dashboard/src/types/security.ts"
      - "cursed-dashboard-/cursed-dashboard/src/lib/validation/security.ts"
      - "cursed-dashboard-/cursed-dashboard/src/components/security/**"
      - "cursed-dashboard-/cursed-dashboard/src/app/**/security/**"
      - "cursed-dashboard-/cursed-dashboard/src/lib/nav-config.ts"
      - ".github/workflows/security-dashboard-ci.yml"
  push:
    branches:
      - feature/moderation-phase-3

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cursed-dashboard-/cursed-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cursed-dashboard-/cursed-dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
