name: Birthday Dashboard CI

on:
  push:
    branches:
      - feat/birthday-dashboard
  pull_request:
    paths:
      - "cursed-dashboard-/cursed-dashboard/src/**/birthdays/**"
      - "cursed-dashboard-/cursed-dashboard/src/components/birthdays/**"
      - "cursed-dashboard-/cursed-dashboard/src/types/birthdays.ts"
      - "cursed-dashboard-/cursed-dashboard/src/lib/nav-config.ts"
      - ".github/workflows/birthday-dashboard-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cursed-dashboard-/cursed-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cursed-dashboard-/cursed-dashboard/package-lock.json
      - run: npm ci
      - name: Build dashboard
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tail -160
