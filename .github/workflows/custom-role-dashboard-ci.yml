name: Custom Role Dashboard CI

on:
  push:
    branches:
      - feat/custom-role-dashboard
  pull_request:
    paths:
      - "cursed-dashboard-/cursed-dashboard/src/app/(dashboard)/dashboard/(guild)/custom-roles/**"
      - "cursed-dashboard-/cursed-dashboard/src/app/api/guilds/[guildId]/custom-roles/**"
      - "cursed-dashboard-/cursed-dashboard/src/components/custom-roles/**"
      - "cursed-dashboard-/cursed-dashboard/src/types/custom-roles.ts"
      - "cursed-dashboard-/cursed-dashboard/src/lib/nav-config.ts"
      - ".github/workflows/custom-role-dashboard-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cursed-dashboard-/cursed-dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cursed-dashboard-/cursed-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
