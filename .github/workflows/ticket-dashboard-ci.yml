name: CURSED Ticket Dashboard CI
on:
  pull_request:
    paths:
      - 'cursed-dashboard-/cursed-dashboard/src/**/tickets/**'
      - 'cursed-dashboard-/cursed-dashboard/src/components/tickets/**'
      - 'cursed-dashboard-/cursed-dashboard/src/types/tickets.ts'
      - 'cursed-dashboard-/cursed-dashboard/src/lib/nav-config.ts'
      - '.github/workflows/ticket-dashboard-ci.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cursed-dashboard-/cursed-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cursed-dashboard-/cursed-dashboard/package-lock.json
      - run: npm ci
      - name: Build dashboard
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tail -120
